<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alem.Crypto</title>

<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0a15;
  --neon:#0ff;
  --pink:#ff00c8;
  --purple:#9b00ff;
  --text:#d9faff;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* Background */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(120deg, rgba(0,255,255,0.04) 1px, transparent 1px),
    linear-gradient(30deg, rgba(255,0,200,0.04) 1px, transparent 1px);
  background-size:60px 60px;
  animation:bgMove 40s linear infinite;
  z-index:-2;
}
@keyframes bgMove{
  from{transform:translate(0,0);}
  to{transform:translate(60px,60px);}
}

/* Particles */
.particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
}
.particle{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:var(--pink);
  opacity:.5;
  animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translateY(-5px);opacity:0}
  50%{opacity:.5}
  100%{transform:translateY(110vh);opacity:0}
}

/* Header */
header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 5%;
  z-index:3;
}

.logo{
  font-family:'Audiowide', cursive;
  font-size:30px;
  color:var(--neon);
  text-shadow:0 0 8px rgba(0,255,255,.6);
}

nav{
  display:flex;
  gap:30px;
}
nav a{
  font-family:Tahoma, sans-serif;
  text-decoration:none;
  color:var(--text);
  font-weight:600;
  position:relative;
}
nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-5px;
  width:0%;
  height:2px;
  background:var(--pink);
  transition:.3s;
}
nav a:hover::after{width:100%}
nav a:hover{color:var(--neon)}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 10%;
  margin-top:80px;
  gap:50px;
}

/* Text block */
.hero-text{
  max-width:600px;
  animation:fadeUp 1.2s ease forwards;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

.welcome{
  font-family:'Audiowide', cursive;
  font-size:44px;
  background:linear-gradient(90deg,var(--neon),var(--pink));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 10px rgba(0,255,255,.5);
}

.text-box{
  margin-top:25px;
  font-family:Tahoma, sans-serif;
  font-size:18px;
  opacity:.85;
  line-height:1.6;
}

/* Avatar IMAGE */
.avatar{
  width:240px;
  height:240px;
  border-radius:50%;
  object-fit:cover;
  animation:float 6s ease-in-out infinite;
}
@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}

/* Mobile */
.menu-toggle{
  display:none;
  flex-direction:column;
  cursor:pointer;
  width:30px;
  height:22px;
  justify-content:space-between;
}
.menu-toggle span{
  height:4px;
  background:var(--text);
  border-radius:2px;
}

@media(max-width:900px){
  .hero{
    flex-direction:column-reverse;
    text-align:center;
  }
  .welcome{font-size:34px;}
  .avatar{width:180px;height:180px;}
}

@media(max-width:768px){
  .logo{font-size:22px;}
  nav{
    position:fixed;
    top:70px;
    right:-220px;
    background:rgba(10,10,21,.95);
    flex-direction:column;
    gap:20px;
    padding:20px;
    transition:.3s;
  }
  nav.active{right:0}
  .menu-toggle{display:flex}
}
</style>
</head>
<body>

<header>
  <div class="logo">Alem.Crypto</div>
  <div class="menu-toggle" id="menu-toggle">
    <span></span><span></span><span></span>
  </div>
  <nav id="nav">
    <a href="#">Home</a>
    <a href="#">About Me</a>
    <a href="#">Crypto Projects</a>
    <a href="#">Contacts</a>
  </nav>
</header>

<div class="hero">
  <div class="hero-text">
    <div class="welcome">Welcome To My Portfolio</div>
    <div class="text-box">
      тут. Место для текста
    </div>
  </div>

  <!-- REAL IMAGE -->
  <img src="img/Ava2.png" alt="Avatar" class="avatar">
</div>

<div class="particles"></div>

<script>
const container=document.querySelector('.particles');
for(let i=0;i<50;i++){
  const p=document.createElement('div');
  p.classList.add('particle');
  p.style.left=Math.random()*100+'vw';
  p.style.top=Math.random()*100+'vh';
  p.style.animationDuration=(Math.random()*6+6)+'s';
  p.style.background=['#0ff','#ff00c8','#9b00ff'][Math.floor(Math.random()*3)];
  container.appendChild(p);
}

const toggle=document.getElementById('menu-toggle');
const nav=document.getElementById('nav');
toggle.onclick=()=>nav.classList.toggle('active');
</script>

</body>
</html>
